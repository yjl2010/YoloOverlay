name: Build APK

# 触发方式：
#   1. 推到 main / master 分支
#   2. 在 GitHub 网页上点 Actions -> Build APK -> Run workflow 手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 云端机器：4 核 / 16GB 内存 / 14GB 磁盘，Android SDK 已预装
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------------------------- 模型
      # 用 ONNX 而不是 TFLite：
      #   ultralytics >= 8.4.83 废弃了 format="tflite"，内部强制改成 format="litert"，
      #   而 litert_torch 在 CI 上会报 '_OpNamespace' 'aten' object has no attribute 'cholesky'。
      #   ONNX 是依赖最少、最稳的导出路径，Android 侧用 onnxruntime-android 推理。
      - name: Export YOLOv8n -> ONNX
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install ultralytics
          python tools/export_yolov8.py --model yolov8n.pt --imgsz 640
          ls -lh app/src/main/assets/

      # 关键：把模型的真实输入/输出形状打出来，并且**真的跑一次推理**。
      # YoloDetector 会在运行时探测输入(NCHW/NHWC)与输出布局，
      # 但如果导出格式不对（比如带了 NMS、或维度对不上），
      # 这一步的日志能立刻看出来，不用等装到手机上才发现一个框都画不出来。
      - name: Verify ONNX model shapes + smoke test
        run: |
          python -c "import onnxruntime" 2>/dev/null || pip install onnxruntime numpy
          python - <<'PY'
          import glob, numpy as np, onnxruntime as ort
          p = glob.glob("app/src/main/assets/*.onnx")[0]
          s = ort.InferenceSession(p, providers=["CPUExecutionProvider"])
          print("模型文件:", p)
          for i in s.get_inputs():
              print("  INPUT ", i.name, i.shape, i.type)
          for o in s.get_outputs():
              print("  OUTPUT", o.name, o.shape, o.type)
          assert len(s.get_outputs()) == 1, "输出必须只有 1 个张量（不要用 nms=True 导出）"
          ins = s.get_inputs()[0]
          shape = [d if isinstance(d, int) and d > 0 else 1 for d in ins.shape]
          print(">> 用全零输入跑一次:", shape)
          out = s.run(None, {ins.name: np.zeros(shape, dtype=np.float32)})
          print(">> 推理成功，输出形状:", [o.shape for o in out])
          n = 4 + 80
          assert any(n in o.shape for o in out), f"输出里找不到 {n} 通道 (4 + 80 类)"
          print(">> 形状校验通过 ✔")
          PY

      # ---------------------------------------------------------------- 构建
      # 用 runner 预装的 Android SDK（ANDROID_HOME 已设置）
      - name: Ensure Android SDK 34
        run: |
          # runner 上 SDK 一般在 /usr/local/lib/android/sdk；兜底补上环境变量
          if [ -z "$ANDROID_HOME" ] && [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager 不在 PATH，直接用 runner 预装的 SDK"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"   || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 工程里没带 wrapper，这里显式装一个 Gradle 8.7（AGP 8.5.2 要求 >= 8.7）
      - name: Install Gradle 8.7
        run: |
          # 注意：不要解压到 /opt —— GitHub runner 上 /opt 归 root 所有，runner 用户写不进去
          curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME/.gradle-dist"
          echo "$HOME/.gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$HOME/.gradle-dist/gradle-8.7/bin/gradle" --version

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolo-overlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      #  Releases 里的附件不需要登录就能下载，手机上直接点链接就能装
      - name: Publish APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "APK build ${{ github.run_number }}" \
            --notes "自动构建产物。直接下载 app-debug.apk 到手机安装即可。" \
          || echo "release 已存在，跳过"
